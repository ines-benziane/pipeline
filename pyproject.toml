[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myo-pipeline"
version = "0.1.0"
description = "Pipeline IRM — PACS to medical report orchestration (runner + methods)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Inès Benziane", email = "i.benziane@institut-myologie.org" },
]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "jinja2",
    "weasyprint",
    "cmcrameri",
    "pydantic",
    "pyyaml",
    "click",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["runner*", "methods*", "cli*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["dicom", "medical_report", ".git"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["runner/**", "methods/**", "tests/**", "adapters/**", "cli/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[project.scripts]
pipeline = "cli.main:cli"